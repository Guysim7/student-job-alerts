name: Student Job Alerts

on:
  schedule:
    # Every hour, 24/7
    - cron: "0 * * * *"
  workflow_dispatch:
    # Allows you to trigger a manual run from the GitHub Actions tab

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # SEEN_JOBS_FILE points outside the workspace so it persists across runs
        run: SEEN_JOBS_FILE="$HOME/seen_jobs.json" python scraper.py
