name: Student Job Alerts

on:
  schedule:
    # Every hour, 24/7
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  # Runs on GitHub's servers — no PC needed.
  # Handles: Amazon, Microsoft, Apple, Check Point, Mobileye, Motorola, monday.com, CyberArk
  scrape-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen jobs cache
        uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            telegram_offset.json
            notify_settings.json
          key: seen-jobs-main-${{ github.run_id }}
          restore-keys: |
            seen-jobs-main-

      - name: Restore workday heartbeat
        uses: actions/cache@v4
        with:
          path: heartbeat_workday.json
          key: heartbeat-workday-${{ github.run_id }}
          restore-keys: |
            heartbeat-workday-

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_GROUP: main
        run: python scraper.py

      - name: Save seen jobs cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            seen_jobs.json
            telegram_offset.json
            notify_settings.json
          key: seen-jobs-main-${{ github.run_id }}

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Main scraper failed — check GitHub Actions"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  # Runs on your PC — only when it's on.
  # Handles: NVIDIA, Intel, Google, Meta (need Playwright)
  scrape-workday:
    runs-on: self-hosted
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_GROUP: workday
        # seen_jobs_workday.json lives at $HOME — persists across git checkouts
        # heartbeat_workday.json is workspace-relative — saved to cache after each run
        run: SEEN_JOBS_FILE="$HOME/seen_jobs_workday.json" python scraper.py

      - name: Save workday heartbeat to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: heartbeat_workday.json
          key: heartbeat-workday-${{ github.run_id }}

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="⚠️ Workday scraper failed — check GitHub Actions"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
